<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DieselDonor | Контрактные запчасти</title>
    <style>
        :root { --bg-main: #0f0f0f; --bg-card: #1a1a1a; --accent: #FFD700; --text-main: #ffffff; --text-sec: #a0a0a0; --border: #333333; }
        body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--bg-main); color: var(--text-main); line-height: 1.6; overflow-x: hidden; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: rgba(15, 15, 15, 0.95); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .logo { font-size: 1.8rem; font-weight: 900; letter-spacing: -1px; color: #fff; text-decoration: none; }
        .logo span { color: var(--accent); }
        .top-info { display: flex; gap: 30px; align-items: center; font-size: 0.9rem; color: var(--text-sec); }
        .top-info div { display: flex; align-items: center; gap: 8px; }
        .top-info strong { color: #fff; }
        .cart-btn { position: relative; background: var(--bg-card); border: 1px solid var(--border); padding: 10px 20px; border-radius: 50px; color: #fff; cursor: pointer; transition: all 0.3s; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .cart-btn:hover { border-color: var(--accent); color: var(--accent); }
        .cart-count { background: var(--accent); color: #000; font-size: 0.75rem; font-weight: bold; padding: 2px 8px; border-radius: 20px; }

        .hero { padding: 80px 20px 60px; text-align: center; background: radial-gradient(circle at top, #252525 0%, #0f0f0f 60%); animation: fadeIn 1s ease-out; }
        h1 { font-size: 3.5rem; margin: 0 0 15px; letter-spacing: -1px; background: linear-gradient(to right, #fff, #ccc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: var(--text-sec); font-size: 1.2rem; max-width: 600px; margin: 0 auto 40px; }
        .search-container { max-width: 700px; margin: 0 auto; position: relative; animation: slideUp 0.8s ease-out 0.2s backwards; }
        .search-input { width: 100%; padding: 20px 30px; border-radius: 50px; border: 2px solid var(--border); background: var(--bg-card); color: #fff; font-size: 1.1rem; outline: none; transition: all 0.3s; box-sizing: border-box; }
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 30px rgba(255, 215, 0, 0.1); }
        .search-btn { position: absolute; right: 8px; top: 8px; bottom: 8px; background: var(--accent); border: none; border-radius: 50px; padding: 0 30px; font-weight: bold; cursor: pointer; transition: transform 0.2s; }
        .search-btn:hover { transform: scale(1.05); }

        .categories-section { padding: 40px 20px; max-width: 1200px; margin: 0 auto; }
        .cat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 30px; }
        .cat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 25px; text-align: center; text-decoration: none; color: #fff; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; }
        .cat-card::before { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(45deg, transparent, rgba(255,215,0,0.05)); opacity: 0; transition: opacity 0.3s; }
        .cat-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .cat-card:hover::before { opacity: 1; }
        .cat-icon { font-size: 2rem; margin-bottom: 10px; display: block; }
        .cat-name { font-weight: 700; font-size: 1.1rem; }

        .popular-section { max-width: 1200px; margin: 60px auto; padding: 0 20px; }
        .section-title { font-size: 2rem; margin-bottom: 30px; display: flex; align-items: center; gap: 15px; }
        .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .card { background: var(--bg-card); border-radius: 20px; overflow: hidden; border: 1px solid var(--border); transition: all 0.4s; display: flex; flex-direction: column; animation: fadeIn 0.6s ease-out backwards; }
        .card:nth-child(1) { animation-delay: 0.1s; } .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; } .card:nth-child(4) { animation-delay: 0.4s; }
        .card:hover { border-color: var(--accent); transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .card-img-wrap { height: 220px; background: #252525; position: relative; overflow: hidden; }
        .card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s; }
        .card:hover img { transform: scale(1.1); }
        .info { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .price { color: var(--accent); font-size: 1.4rem; font-weight: 800; margin-top: auto; padding-top: 15px; }
        .title { font-size: 1.05rem; margin: 0; line-height: 1.4; font-weight: 600; }
        .meta { color: #666; font-size: 0.85rem; margin-top: 8px; }

        .map-section { max-width: 1200px; margin: 80px auto 40px; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; }
        .map-frame { width: 100%; height: 350px; border-radius: 20px; border: 1px solid var(--border); filter: grayscale(100%) invert(92%) contrast(83%); }
        .contact-details h3 { font-size: 1.8rem; margin-bottom: 20px; color: var(--accent); }
        .contact-item { margin-bottom: 15px; font-size: 1.1rem; display: flex; gap: 10px; }
        footer { text-align: center; padding: 40px; color: #444; border-top: 1px solid var(--border); margin-top: 60px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { h1 { font-size: 2.2rem; } header { flex-direction: column; gap: 15px; padding: 15px; } .top-info { flex-wrap: wrap; justify-content: center; } .map-section { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">Diesel<span>Donor</span></a>
        <div class="top-info">
            <div>📍 г. Владивосток, ул. Матросова, д. 30</div>
            <div>🕒 Пн-Пт: 10:00 - 18:00 </div>
            <div>📞 +7 (951) 011-58-78</div>
        </div>
        <a href="/cart" class="cart-btn">🛒 Корзина <span class="cart-count">{{ session.get('cart', [])|length }}</span></a>
    </header>

    <div class="hero">
        <h1>Контрактные запчасти</h1>
