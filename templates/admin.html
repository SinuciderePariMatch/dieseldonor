<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель | DieselDonor</title>
    <style>
        body { margin: 0; font-family: -apple-system, sans-serif; background: #0f0f0f; color: #fff; display: flex; height: 100vh; }
        .sidebar { width: 260px; background: #1a1a1a; border-right: 1px solid #333; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
        .logo { font-size: 1.5rem; font-weight: 800; color: #FFD700; margin-bottom: 40px; text-decoration: none; display: block; }
        .nav-item { padding: 14px 18px; border-radius: 12px; color: #888; text-decoration: none; transition: all 0.3s; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 0.95rem; }
        .nav-item:hover, .nav-item.active { background: rgba(255,215,0,0.1); color: #FFD700; }
        .nav-item.logout { margin-top: auto; color: #ff4444; }
        .nav-item.logout:hover { background: rgba(255,68,68,0.1); }
        
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        h2 { border-left: 4px solid #FFD700; padding-left: 15px; margin-top: 0; margin-bottom: 30px; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #888; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; outline: none; box-sizing: border-box; }
        input:focus { border-color: #FFD700; }
        .btn { background: #FFD700; color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        .product-list { display: grid; gap: 15px; margin-top: 30px; }
        .product-item { background: #1a1a1a; padding: 20px; border-radius: 12px; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="/" class="logo">DieselDonor</a>
        <div class="nav-item active" onclick="switchTab('products')">📦 Товары</div>
        <div class="nav-item" onclick="window.location.href='/admin/orders'">🛒 Заказы</div>
        <div class="nav-item" onclick="window.location.href='/admin/chats'">💬 Сообщения</div>
        <div class="nav-item" onclick="switchTab('settings')">⚙️ Настройки</div>
        <a href="/admin/logout" class="nav-item logout">🚪 Выйти</a>
    </div>

    <div class="main">
        <!-- Вкладка Товары -->
        <div id="tab-products" class="tab-content active">
            <h2>Управление товарами</h2>
            <div style="background:#1a1a1a; padding:25px; border-radius:16px; margin-bottom:30px;">
                <form action="/admin/add" method="POST">
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                        <div class="form-group"><label>Название *</label><input name="name" required></div>
                        <div class="form-group"><label>Категория</label>
                            <select name="category">
                                <option>ТНВД</option><option>Форсунки</option><option>Турбина</option><option>АКПП</option><option>Запчасти и фильтра</option><option>Мелочь</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group"><label>Цена (₽)</label><input type="number" name="price"></div>
                    <div class="form-group"><label>Ссылка на фото</label><input name="images" placeholder="https://..."></div>
                    <button type="submit" class="btn">Добавить товар</button>
                </form>
            </div>
            
            <h3>Список товаров ({{ products|length }})</h3>
            <div class="product-list">
                {% for p in products %}
                <div class="product-item">
                    <div><strong>{{ p.name }}</strong><br><span style="color:#666; font-size:0.85rem;">{{ p.category }} • {{ p.price or 0 }} ₽</span></div>
                    <form action="/admin/delete/{{ p.id }}" method="POST" onsubmit="return confirm('Удалить?')">
                        <button type="submit" class="btn" style="background:#ff4444; color:#fff; padding:8px 16px;">Удалить</button>
                    </form>
                </div>
                {% endfor %}
            </div>
        </div>

        <!-- Вкладка Настройки -->
        <div id="tab-settings" class="tab-content" style="display:none;">
            <h2>Настройки сайта</h2>
            <form action="/admin/settings" method="POST" style="max-width:600px;">
                <div class="form-group"><label>Телефон</label><input name="phone" value="{{ settings.get('phone', '') }}"></div>
                <div class="form-group"><label>Адрес</label><input name="address" value="{{ settings.get('address', '') }}"></div>
                <div class="form-group"><label>Часы работы</label><input name="work_hours" value="{{ settings.get('work_hours', '') }}"></div>
                <div class="form-group"><label>Заголовок на главной</label><input name="hero_title" value="{{ settings.get('hero_title', '') }}"></div>
                <button type="submit" class="btn">Сохранить изменения</button>
            </form>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const tab = document.getElementById('tab-' + tabName);
            if (tab) tab.style.display = 'block';
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
