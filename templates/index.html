    <script>
        // --- 1. ПЛАВНЫЙ СКРОЛЛ ДЛЯ МЕНЮ ---
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('href');
                    if (targetId === '#') return;
                    const targetElement = document.querySelector(targetId);
                    if (targetElement) {
                        targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                });
            });
            
            // Запуск анимаций появления
            const reveals = document.querySelectorAll('.reveal');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });
            reveals.forEach((el) => observer.observe(el));
        });

        // --- 2. ДАННЫЕ И ЧАТ ---
        const appData = document.getElementById('app-data').dataset;
        const FIRST_PRODUCT_ID = appData.firstProductId || null;
        const FIRST_PRODUCT_NAME = appData.firstProductName || 'ТНВД';
        const CHAT_SESSION_ID = localStorage.getItem('chat_session_id') || 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('chat_session_id', CHAT_SESSION_ID);

        let clientAudioCtx = null;
        let lastKnownMsgCount = 0;
        let isManagerConnected = false; 

        function toggleChat() {
            const win = document.getElementById('chat-window');
            if (!clientAudioCtx) clientAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (win.style.display === 'none' || win.style.display === '') {
                win.style.display = 'flex';
                setTimeout(() => document.getElementById('chat-input').focus(), 100);
            } else {
                win.style.display = 'none';
            }
        }

        function appendMessage(sender, html) {
            const container = document.getElementById('chat-messages');
            if (!container) return;
            const div = document.createElement('div');
            div.innerHTML = html;
            div.style.cssText = sender === 'client' 
                ? 'align-self:flex-end; background:var(--accent); color:#000; padding:12px 16px; border-radius:18px 18px 4px 18px; max-width:85%; font-size:0.9rem; animation:slideUp 0.2s;'
                : 'align-self:flex-start; background:rgba(255,255,255,0.1); padding:12px 16px; border-radius:18px 18px 18px 4px; max-width:85%; font-size:0.9rem; color:#e8e8ed; animation:slideUp 0.2s; line-height:1.5;';
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function updateCartBadge(count) {
            const badge = document.querySelector('.nav-cart span');
            if (badge) badge.textContent = count;
        }

        function playClientSound() {
            try {
                if (!clientAudioCtx) clientAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = clientAudioCtx.createOscillator();
                const gain = clientAudioCtx.createGain();
                osc.connect(gain); gain.connect(clientAudioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, clientAudioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, clientAudioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, clientAudioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, clientAudioCtx.currentTime + 0.4);
                osc.start(); osc.stop(clientAudioCtx.currentTime + 0.4);
            } catch(e) {}
        }

        function showClientNotification(text) {
            const old = document.getElementById('client-notify');
            if (old) old.remove();
            const notify = document.createElement('div');
            notify.id = 'client-notify';
            notify.innerHTML = `🔔 <b>${text}</b>`;
            notify.style.cssText = `
                position: fixed; top: 80px; right: 30px; z-index: 10000;
                background: var(--accent); color: #000; padding: 12px 24px;
                border-radius: 50px; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
                animation: slideInRight 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                font-family: -apple-system, sans-serif;
            `;
            document.body.appendChild(notify);
            setTimeout(() => {
                notify.style.transition = 'all 0.3s';
                notify.style.opacity = '0'; notify.style.transform = 'translateX(100%)';
                setTimeout(() => notify.remove(), 300);
            }, 4000);
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            appendMessage('client', text);
            input.value = '';

            fetch('/api/chat/save', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ session_id: CHAT_SESSION_ID, sender: 'client', message: text })
            }).catch(e => console.error('Save error:', e));

            // Если менеджер подключился - бот молчит
            if (isManagerConnected) return;

            const lowerText = text.toLowerCase();
            if (lowerText.includes('доставк') || lowerText.includes('рассчитай')) {
                showDeliveryForm();
            } else if (lowerText.includes('добавь') || lowerText.includes('куплю')) {
                if (FIRST_PRODUCT_ID) addToCartViaChat(FIRST_PRODUCT_ID, FIRST_PRODUCT_NAME);
            } else {
                setTimeout(() => {
                    appendMessage('manager', 'Я передал ваш вопрос менеджеру. Ожидайте ответа!');
                    appendActionButtons();
                }, 1000);
            }
        }

        // Автопроверка новых ответов
        setInterval(async () => {
            try {
                const res = await fetch(`/api/chat/history/${CHAT_SESSION_ID}`);
                if (!res.ok) return;
                const msgs = await res.json();
                
                if (msgs.length > 0) {
                    // Проверяем наличие системного сообщения во всей истории
                    if (!isManagerConnected && msgs.some(m => m.sender === 'system')) {
                        isManagerConnected = true;
                    }

                    const lastMsg = msgs[msgs.length - 1];
                    
                    if ((lastMsg.sender === 'manager' || lastMsg.sender === 'system') && msgs.length > lastKnownMsgCount) {
                        lastKnownMsgCount = msgs.length;
                        
                        const chatWin = document.getElementById('chat-window');
                        if (chatWin && (chatWin.style.display === 'none' || chatWin.style.display === '')) {
                            playClientSound();
                            showClientNotification(lastMsg.sender === 'system' ? "Менеджер подключился!" : "Менеджер ответил вам!");
                            
                            const btn = document.querySelector('#chat-widget button');
                            if(btn) {
                                btn.style.animation = 'pulse 1s infinite';
                                setTimeout(() => btn.style.animation = '', 5000);
                            }
                        } else if (chatWin) {
                            if (lastMsg.sender === 'system') {
                                const sysDiv = document.createElement('div');
                                sysDiv.innerHTML = lastMsg.message;
                                sysDiv.style.cssText = 'align-self:center; background:rgba(255,215,0,0.15); border:1px solid var(--accent); color:var(--accent); padding:10px 16px; border-radius:20px; font-size:0.85rem; text-align:center; max-width:90%; animation:slideUp 0.3s; margin: 10px 0;';
                                document.getElementById('chat-messages').appendChild(sysDiv);
                            } else {
                                appendMessage('manager', lastMsg.message);
                            }
                        }
                    }
                }
            } catch (e) { console.log('Polling error:', e); }
        }, 3000);

        // --- 3. ФОРМА РАСЧЕТА ДОСТАВКИ В ЧАТЕ ---
        function showDeliveryForm() {
            const container = document.getElementById('chat-messages');
            if(!container) return;
            const formDiv = document.createElement('div');
            formDiv.className = 'chat-form-container';
            formDiv.style.cssText = 'align-self:flex-start; background:rgba(255,255,255,0.05); padding:16px; border-radius:18px; max-width:90%; animation:slideUp 0.3s; border: 1px solid rgba(255,255,255,0.1);';
            formDiv.innerHTML = `
                <div style="font-size:0.85rem; color:#FFD700; margin-bottom:12px; font-weight:600;">🚚 Расчет стоимости доставки</div>
                <label style="display:block; font-size:0.75rem; color:#86868b; margin-bottom:4px;">Откуда (склад):</label>
                <input type="text" id="chat-city-from" value="Владивосток" style="width:100%; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:10px 12px; color:#fff; margin-bottom:12px; outline:none; font-size:0.9rem;">
                <label style="display:block; font-size:0.75rem; color:#86868b; margin-bottom:4px;">Куда (город получателя):</label>
                <input type="text" id="chat-city-to" placeholder="Например: Москва" style="width:100%; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:10px 12px; color:#fff; margin-bottom:12px; outline:none; font-size:0.9rem;">
                <label style="display:block; font-size:0.75rem; color:#86868b; margin-bottom:4px;">Примерный вес (кг):</label>
                <input type="number" id="chat-weight" value="5" min="1" style="width:100%; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:10px 12px; color:#fff; margin-bottom:16px; outline:none; font-size:0.9rem;">
                <button onclick="calcDelivery()" style="width:100%; background:var(--accent); border:none; border-radius:12px; padding:12px; font-weight:700; color:#000; cursor:pointer; transition:opacity 0.2s;">Рассчитать стоимость</button>
            `;
            container.appendChild(formDiv);
            container.scrollTop = container.scrollHeight;
            setTimeout(() => document.getElementById('chat-city-to').focus(), 100);
        }

        async function calcDelivery() {
            const cityFrom = document.getElementById('chat-city-from').value || 'Владивосток';
            const cityTo = document.getElementById('chat-city-to').value || 'Москва';
            const weight = document.getElementById('chat-weight').value || 5;
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = '⏳ Считаем...'; btn.disabled = true; btn.style.opacity = '0.7';

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);
                const res = await fetch('/api/calculate-delivery', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ city_from: cityFrom, city_to: cityTo, weight: parseFloat(weight) }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                if (!res.ok) throw new Error(`Сервер вернул ошибку ${res.status}`);
                const data = await res.json();
                
                let resultHtml = `✅ <b>Маршрут: ${cityFrom} → ${cityTo}</b> (${weight} кг)<br><br>`;
                if (data.price) {
                     resultHtml += `• <b>Стоимость:</b> ${data.price} ₽<br>• <b>Срок:</b> ${data.days} дн.<br>`;
                } else if (typeof data === 'object') {
                    for (const [tk, info] of Object.entries(data)) {
                        if (info && typeof info === 'object' && info.price) {
                            resultHtml += `• <b>${tk}</b>: ${info.price} ₽ <span style="color:#86868b">(${info.days} дн.)</span><br>`;
                        }
                    }
                } else { resultHtml += '❓ Не удалось распознать тарифы.'; }
                appendMessage('manager', resultHtml);
            } catch (e) {
                console.error('Calc error:', e);
                let errorMsg = '❌ Ошибка расчета: ';
                if (e.name === 'AbortError') errorMsg += 'Сервер долго отвечает. Попробуйте через минуту.';
                else if (e.message.includes('Failed to fetch')) errorMsg += 'Нет связи с сервером.';
                else errorMsg += e.message;
                appendMessage('manager', errorMsg);
            } finally {
                btn.textContent = originalText; btn.disabled = false; btn.style.opacity = '1';
            }
        }

        async function addToCartViaChat(productId, productName) {
            try {
                const formData = new FormData();
                formData.append('product_id', productId);
                const res = await fetch('/api/cart/add-ajax', {method: 'POST', body: formData});
                const data = await res.json();
                if (data.status === 'ok') {
                    appendMessage('manager', `✅ Товар "<b>${productName}</b>" добавлен в корзину!<br>Всего товаров: ${data.count}`);
                    updateCartBadge(data.count);
                }
            } catch (e) { appendMessage('manager', '❌ Не удалось добавить товар.'); }
        }

        function appendActionButtons() {
            const container = document.getElementById('chat-messages');
            if(!container) return;
            const btnsDiv = document.createElement('div');
            btnsDiv.style.cssText = 'align-self:flex-start; display:flex; gap:8px; flex-wrap:wrap; margin-top:5px; animation:slideUp 0.3s;';
            const actions = [
                {text: '🚚 Рассчитать доставку', fn: showDeliveryForm},
                {text: '🛒 Добавить ТНВД', fn: () => addToCartViaChat(FIRST_PRODUCT_ID, FIRST_PRODUCT_NAME)}
            ];
            actions.forEach(act => {
                const btn = document.createElement('button');
                btn.textContent = act.text; btn.onclick = act.fn;
                btn.style.cssText = 'background:rgba(255,215,0,0.1); border:1px solid var(--accent); color:var(--accent); padding:8px 14px; border-radius:20px; font-size:0.8rem; cursor:pointer; transition:all 0.2s;';
                btn.onmouseover = () => {btn.style.background='var(--accent)'; btn.style.color='#000';};
                btn.onmouseout = () => {btn.style.background='rgba(255,215,0,0.1)'; btn.style.color='var(--accent)';};
                btnsDiv.appendChild(btn);
            });
            container.appendChild(btnsDiv);
            container.scrollTop = container.scrollHeight;
        }
    </script>
