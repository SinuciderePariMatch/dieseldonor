<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DieselDonor | Контрактные запчасти</title>
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; min-height: 100vh; }
        .hero { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        h1 { font-size: 3rem; margin-bottom: 10px; letter-spacing: -1px; }
        p.subtitle { color: #aaa; font-size: 1.2rem; max-width: 600px; margin-bottom: 40px; line-height: 1.5; }
        
        .btn-group { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .btn { padding: 16px 32px; border-radius: 12px; text-decoration: none; font-weight: 600; transition: transform 0.2s, opacity 0.2s; border: none; cursor: pointer; font-size: 1rem; }
        .btn-primary { background: #FFD700; color: #000; }
        .btn-secondary { background: #2a2a2a; color: #fff; border: 1px solid #444; }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; }

        footer { padding: 20px; text-align: center; color: #555; font-size: 0.9rem; border-top: 1px solid #222; }
        @media (max-width: 600px) { h1 { font-size: 2rem; } .btn { width: 100%; } }
    </style>
</head>
<body>
    <div class="hero">
        <h1>DieselDonor</h1>

        <div class="btn-group">
            <a href="/catalog" class="btn btn-primary">📂 Перейти в каталог</a>
            <a href="https://wa.me/79000000000" target="_blank" class="btn btn-secondary">📞 Написать в WhatsApp</a>
        </div>
    </div>

    <footer>
        © 2026 DieselDonor. Все права защищены.
    </footer>
</body>
</html>
